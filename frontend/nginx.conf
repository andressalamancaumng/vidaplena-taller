server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No registrar cédulas consultadas en la URL. La API registra rechazos sin datos sensibles.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Angular usa rutas del lado del cliente (routing): cualquier ruta que
    # no exista como archivo se redirige a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
